<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="gIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#115e59" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="gSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.55"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="48" y="46" fill="#f8fafc" font-size="24" font-weight="600">ResolveIQ — Level 2 Multi-Agent Support System</text>
  <text x="48" y="72" fill="#94a3b8" font-size="13">A1 Intent Analyst → A3 Routing → A2 Response Specialist → A4 Response Auditor → A5 Coordinator · one decision: ANSWER / CLARIFY / ESCALATE · every step traced</text>

  <!-- Lane 1: offline -->
  <text x="48" y="108" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.4">1 · OFFLINE — TRAINING, SPLITS, EVIDENCE</text>
  <rect x="48" y="120" width="252" height="104" rx="10" fill="url(#gSlate)" stroke="#334155"/>
  <text x="64" y="144" fill="#e2e8f0" font-size="13" font-weight="600">Bitext support dataset</text>
  <text x="64" y="164" fill="#94a3b8" font-size="11">data/train.csv + validation.csv</text>
  <text x="64" y="182" fill="#94a3b8" font-size="11">22,841 rows · 27 intents · 11 categories</text>
  <text x="64" y="200" fill="#64748b" font-size="11">templated English support utterances</text>

  <rect x="322" y="120" width="252" height="104" rx="10" fill="url(#gSlate)" stroke="#334155"/>
  <text x="338" y="144" fill="#e2e8f0" font-size="13" font-weight="600">Leak-free splits</text>
  <text x="338" y="164" fill="#94a3b8" font-size="11">nlp/split_data.py · seed 42</text>
  <text x="338" y="182" fill="#94a3b8" font-size="11">train 15,567 · dev 1,730 · test 3,475</text>
  <text x="338" y="200" fill="#64748b" font-size="11">deduplicated, validation leaks removed</text>

  <rect x="596" y="120" width="252" height="104" rx="10" fill="url(#gIndigo)" stroke="#4f46e5"/>
  <text x="612" y="144" fill="#e0e7ff" font-size="13" font-weight="600">A1 model + calibration</text>
  <text x="612" y="164" fill="#c7d2fe" font-size="11">scripts/train_a1.py</text>
  <text x="612" y="182" fill="#c7d2fe" font-size="11">MiniLM embeddings → LogisticRegression</text>
  <text x="612" y="200" fill="#a5b4fc" font-size="11">temperature + τ + s_min saved to models/</text>

  <rect x="870" y="120" width="282" height="104" rx="10" fill="url(#gSlate)" stroke="#334155"/>
  <text x="886" y="144" fill="#e2e8f0" font-size="13" font-weight="600">Evidence artifacts</text>
  <text x="886" y="164" fill="#94a3b8" font-size="11">outputs/evidence/a1.json · a2.json</text>
  <text x="886" y="182" fill="#94a3b8" font-size="11">robustness.json · l2_decisions.json</text>
  <text x="886" y="200" fill="#64748b" font-size="11">trace_examples.json → synced to web/public</text>

  <!-- Lane 2: serving -->
  <text x="48" y="262" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.4">2 · SERVING — ONE QUESTION, FIVE AGENTS (nlp/pipeline.py)</text>

  <rect x="48" y="276" width="112" height="128" rx="10" fill="url(#gSlate)" stroke="#334155"/>
  <text x="64" y="300" fill="#e2e8f0" font-size="13" font-weight="600">Customer</text>
  <text x="64" y="318" fill="#e2e8f0" font-size="13" font-weight="600">query</text>
  <text x="64" y="338" fill="#94a3b8" font-size="11">free text,</text>
  <text x="64" y="354" fill="#94a3b8" font-size="11">any wording</text>
  <text x="64" y="376" fill="#64748b" font-size="11">POST /resolve</text>

  <rect x="188" y="276" width="168" height="128" rx="10" fill="url(#gIndigo)" stroke="#4f46e5"/>
  <text x="204" y="300" fill="#e0e7ff" font-size="12" font-weight="700">A1 · INTENT ANALYST</text>
  <text x="204" y="320" fill="#c7d2fe" font-size="11">intent + category</text>
  <text x="204" y="336" fill="#c7d2fe" font-size="11">confidence, margin</text>
  <text x="204" y="352" fill="#c7d2fe" font-size="11">top-3, top-1 similarity</text>
  <text x="204" y="378" fill="#a5b4fc" font-size="11">nlp/a1.py</text>

  <rect x="384" y="276" width="168" height="128" rx="10" fill="url(#gIndigo)" stroke="#4f46e5"/>
  <text x="400" y="300" fill="#e0e7ff" font-size="12" font-weight="700">A3 · ROUTING / PLAN</text>
  <text x="400" y="320" fill="#c7d2fe" font-size="11">route: answer /</text>
  <text x="400" y="336" fill="#c7d2fe" font-size="11">clarify / escalate</text>
  <text x="400" y="352" fill="#c7d2fe" font-size="11">missing slots, k, reasons</text>
  <text x="400" y="378" fill="#a5b4fc" font-size="11">nlp/l2/a3.py</text>

  <rect x="580" y="276" width="168" height="128" rx="10" fill="url(#gTeal)" stroke="#0d9488"/>
  <text x="596" y="300" fill="#ccfbf1" font-size="12" font-weight="700">A2 · RESPONSE SPECIALIST</text>
  <text x="596" y="320" fill="#99f6e4" font-size="11">retrieves candidate</text>
  <text x="596" y="336" fill="#99f6e4" font-size="11">+ supporting examples</text>
  <text x="596" y="352" fill="#99f6e4" font-size="11">self-check before return</text>
  <text x="596" y="378" fill="#5eead4" font-size="11">nlp/a2.py</text>

  <rect x="776" y="276" width="168" height="128" rx="10" fill="url(#gTeal)" stroke="#0d9488"/>
  <text x="792" y="300" fill="#ccfbf1" font-size="12" font-weight="700">A4 · RESPONSE AUDITOR</text>
  <text x="792" y="320" fill="#99f6e4" font-size="11">alignment, grounding,</text>
  <text x="792" y="336" fill="#99f6e4" font-size="11">claims, placeholders,</text>
  <text x="792" y="352" fill="#99f6e4" font-size="11">contradiction</text>
  <text x="792" y="378" fill="#5eead4" font-size="11">nlp/l2/a4.py</text>

  <rect x="972" y="276" width="180" height="128" rx="10" fill="url(#gIndigo)" stroke="#4f46e5"/>
  <text x="988" y="300" fill="#e0e7ff" font-size="12" font-weight="700">A5 · COORDINATOR</text>
  <text x="988" y="320" fill="#c7d2fe" font-size="11">combines plan, candidate</text>
  <text x="988" y="336" fill="#c7d2fe" font-size="11">and audit → one decision</text>
  <text x="988" y="352" fill="#c7d2fe" font-size="11">+ full agent trace</text>
  <text x="988" y="378" fill="#a5b4fc" font-size="11">nlp/a5.py</text>

  <!-- agent arrows -->
  <line x1="160" y1="340" x2="184" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="356" y1="340" x2="380" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="552" y1="340" x2="576" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="748" y1="340" x2="772" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="944" y1="340" x2="968" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- retry loop -->
  <path d="M 860 404 L 860 428 L 664 428 L 664 408" fill="none" stroke="#0d9488" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="700" y="444" fill="#5eead4" font-size="11">one retry: ask A2 for the next-best candidate, then audit again</text>

  <!-- clarify / escalate shortcuts -->
  <path d="M 468 404 L 468 470 L 1080 470 L 1080 452" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowAmber)"/>
  <text x="556" y="490" fill="#fbbf24" font-size="11">clarify / escalate needs no candidate: A2 and A4 are skipped (the trace still has five steps)</text>

  <!-- Lane 3: storage + web -->
  <text x="48" y="512" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.4">3 · RETRIEVAL STORAGE</text>
  <rect x="48" y="524" width="330" height="130" rx="10" fill="url(#gSlate)" stroke="#334155"/>
  <text x="64" y="548" fill="#e2e8f0" font-size="13" font-weight="600">Supabase Postgres + pgvector</text>
  <text x="64" y="568" fill="#94a3b8" font-size="11">examples table · vector(384) · cosine index</text>
  <text x="64" y="586" fill="#94a3b8" font-size="11">RPC match_examples + intent/category routing</text>
  <text x="64" y="604" fill="#94a3b8" font-size="11">audit_log + metrics tables (telemetry)</text>
  <text x="64" y="624" fill="#64748b" font-size="11">fallback: in-memory cosine over TRAIN embeddings</text>
  <text x="64" y="642" fill="#64748b" font-size="11">/health reports which backend is live</text>

  <text x="404" y="512" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.4">4 · WEB APP (web/ · Next.js 14)</text>
  <rect x="404" y="524" width="748" height="130" rx="10" fill="url(#gSlate)" stroke="#334155"/>
  <text x="420" y="548" fill="#e2e8f0" font-size="13" font-weight="600">Decision-first UI</text>
  <text x="420" y="568" fill="#94a3b8" font-size="11">/ live demo · /results held-out metrics · /architecture agents · /data dataset · /robustness evaluation</text>
  <text x="420" y="586" fill="#94a3b8" font-size="11">decision badge, final response or clarifying question, expandable A1–A5 timeline</text>
  <text x="420" y="604" fill="#94a3b8" font-size="11">A4 per-check results and before/after text when a response was revised</text>
  <text x="420" y="622" fill="#94a3b8" font-size="11">/api/resolve server-side proxy · clarification reply re-runs the query</text>
  <text x="420" y="640" fill="#64748b" font-size="11">backend cold or down → cached demo payloads, explicitly labelled “Cached”</text>

  <!-- Lane 4: decisions -->
  <text x="48" y="700" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.4">5 · FINAL DECISIONS</text>

  <rect x="48" y="712" width="352" height="112" rx="10" fill="url(#gTeal)" stroke="#22c55e"/>
  <text x="64" y="736" fill="#dcfce7" font-size="14" font-weight="700">ANSWER</text>
  <text x="64" y="756" fill="#bbf7d0" font-size="11">relevant evidence + enough confidence,</text>
  <text x="64" y="772" fill="#bbf7d0" font-size="11">and A4 accepted or safely revised the candidate</text>
  <text x="64" y="792" fill="#86efac" font-size="11">served text is the audited one, never the raw candidate</text>
  <text x="64" y="810" fill="#86efac" font-size="11">reason codes: audit_accept / audit_revise</text>

  <rect x="424" y="712" width="352" height="112" rx="10" fill="url(#gSlate)" stroke="#f59e0b"/>
  <text x="440" y="736" fill="#fef3c7" font-size="14" font-weight="700">CLARIFY</text>
  <text x="440" y="756" fill="#fde68a" font-size="11">essential information is missing, or two intents</text>
  <text x="440" y="772" fill="#fde68a" font-size="11">are too close to separate</text>
  <text x="440" y="792" fill="#fcd34d" font-size="11">asks for exactly the missing item (e.g. order number)</text>
  <text x="440" y="810" fill="#fcd34d" font-size="11">reason codes: missing_information / ambiguous_intent</text>

  <rect x="800" y="712" width="352" height="112" rx="10" fill="url(#gSlate)" stroke="#f43f5e"/>
  <text x="816" y="736" fill="#ffe4e6" font-size="14" font-weight="700">ESCALATE</text>
  <text x="816" y="756" fill="#fecdd3" font-size="11">unsupported or out-of-scope, confidence below floor,</text>
  <text x="816" y="772" fill="#fecdd3" font-size="11">sensitive content, or an unresolved conflict</text>
  <text x="816" y="792" fill="#fda4af" font-size="11">human handoff: reasons, intent, evidence, queue</text>
  <text x="816" y="810" fill="#fda4af" font-size="11">reason codes: out_of_distribution / low_confidence / …</text>

  <!-- Footer -->
  <text x="48" y="854" fill="#f87171" font-size="11" font-weight="600">Responsibility rule: no output may claim that an order, payment, refund or account was actually changed, processed, cancelled or updated.</text>
  <text x="48" y="872" fill="#f87171" font-size="11" font-weight="600">No invented amounts, dates, order numbers or delivery times either — anything not in the query or the retrieved evidence is dropped.</text>
  <text x="48" y="890" fill="#475569" font-size="10">Sources: nlp/{a1,a2,pipeline}.py · nlp/l2/{a3,a4}.py · nlp/a5.py · api/main.py · config/l2_policy.json · web/app/</text>
</svg>
