services:
  - type: web
    name: nlp-support-api
    runtime: python
    plan: free
    repo: https://github.com/Anonymous-Ekansh/NLPSupportSystem
    branch: main
    buildCommand: pip install -r requirements-api.txt && python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-en-v1.5')"
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.13"
      # Memory ceilings for the 512 MB free tier: BLAS/OpenMP threads multiply
      # per-thread arenas and workspaces; this keeps the process well under
      # the limit (each of these is also setdefault-ed inside nlp/embed.py,
      # but env vars apply to every library that reads them, incl. numpy/uvicorn).
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
