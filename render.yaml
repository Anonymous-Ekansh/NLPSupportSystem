services:
  - type: web
    name: nlp-support-api
    runtime: python
    plan: starter
    repo: https://github.com/Anonymous-Ekansh/NLPSupportSystem
    branch: main
    buildCommand: pip install -r requirements-nlp.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.13"
